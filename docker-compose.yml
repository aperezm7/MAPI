services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      GBIF_USER_AGENT: ${GBIF_USER_AGENT:-MAPI/0.1 (species occurrence maps; research/education)}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,https://localhost:8443,https://127.0.0.1:8443,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000}
      IUCN_API_TOKEN: ${IUCN_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
      GBIF_USERNAME: ${GBIF_USERNAME:-}
      GBIF_PASSWORD: ${GBIF_PASSWORD:-}
      GBIF_DOWNLOAD_EMAIL: ${GBIF_DOWNLOAD_EMAIL:-}
      # Auth is on for this stack. Empty token and secret are generated once into the data volume.
      # Leave GBIF_USERNAME and GBIF_PASSWORD empty; each client connects its own GBIF login.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      MAPI_ADMIN_TOKEN: ${MAPI_ADMIN_TOKEN:-}
      MAPI_SECRET_KEY: ${MAPI_SECRET_KEY:-}
      DATABASE_PATH: /app/data/mapi.sqlite
      QUOTA_MAPS_PER_DAY: ${QUOTA_MAPS_PER_DAY:-100}
      QUOTA_PLANS_PER_DAY: ${QUOTA_PLANS_PER_DAY:-40}
      QUOTA_REQUESTS_PER_MINUTE: ${QUOTA_REQUESTS_PER_MINUTE:-30}
      DEFAULT_BUDGET: ${DEFAULT_BUDGET:-100}
    volumes:
      - mapi-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  # HTTPS in front of the app nginx. Self-signed localhost certificate on first start.
  tls:
    build:
      context: ./deploy/tls
    ports:
      - "8443:443"
    volumes:
      - mapi-tls:/etc/nginx/certs
    depends_on:
      - web

volumes:
  mapi-data:
  mapi-tls:
